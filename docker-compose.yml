services:

  postgres:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: webservices
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
        - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d webservices"]
      interval: 5s
      timeout: 5s
      retries: 5
      

  auth_service:
    build: ./auth_service
    container_name: auth_service
    expose:
      - "8001"
    environment:
      JWT_SECRET: supersecretkey
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: webservices
      DB_USER: user
      DB_PASSWORD: password
    depends_on:
      postgres:
        condition: service_healthy

  shortening_service:
    build: ./shortening_service
    container_name: shortening_service
    expose:
      - "8000"
    environment:
      AUTH_SERVICE_URL: http://auth_service:8001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: webservices
      DB_USER: user
      DB_PASSWORD: password
    depends_on:
      postgres:
        condition: service_healthy
      auth_service:
        condition: service_started
    
  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "8080:80"
    volumes:
       - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth_service
      - shortening_service



volumes:
  postgres_data: