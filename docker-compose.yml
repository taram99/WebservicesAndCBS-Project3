services:
  auth_service:
    build: ./auth_service
    container_name: auth_service
    expose: #exposes the port to other services in the Docker network instead of Ports which maps to the host machine
      - "8001"
    volumes:
      - auth_data:/data
    environment:
      - JWT_SECRET= supersecretkey
      - DB_PATH=/data/auth.db

  shortening_service:
    build: ./shortening_service
    container_name: shortening_service
    expose: #exposes the port to other services in the Docker network instead of Ports which maps to the host machine
      - "8000"
    volumes:
      - shortener_data:/data
    depends_on:
      - auth_service
    
  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "8080:80"
    volumes:
       - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth_service
      - shortening_service



volumes:
  auth_data:
  shortener_data: